[package]
name = "onde-desktop"
version = "0.6.1"
edition = "2024"
description = "Onde Desktop: fine-tune, chat with and publish models on your computer."
license = "MIT OR Apache-2.0"
publish = false

# An empty workspace keeps this crate out of the onde-cli workspace and gives
# it its own Cargo.lock.
[workspace]

[lib]
name = "onde_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
onde-cli = { path = "../../..", default-features = false }
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-os = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
tauri-plugin-oauth = "2"
url = "2"
rand = "0.9"
smbcloud-auth-sdk = "0.3.34"
smbcloud-model = "0.3.35"
smbcloud-network = "0.3.35"
base64 = "0.22"

# The folder chooser and security-scoped bookmarks. Both are AppKit and Foundation
# calls with no Tauri API, so they are used directly and only on macOS.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSData", "NSError", "NSObject", "NSProcessInfo", "NSString", "NSURL"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSOpenPanel", "NSSavePanel", "NSPanel", "NSWindow", "NSResponder", "NSApplication"] }

# Windows and Linux get their chooser from the dialog plugin, called from Rust
# only. The webview is still granted no dialog permission.
[target.'cfg(not(target_os = "macos"))'.dependencies]
tauri-plugin-dialog = "2"

# Keeps the PC from sleeping while a training job runs.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Power"] }

[dev-dependencies]
tempfile = "3"

# `tauri dev` is a debug build, and an unoptimized trainer and GGUF quantizer are
# unusably slow: exporting a 1.7B model took over five minutes where an optimized
# build takes under one. Dependencies, which include the onde-cli pipeline and
# candle, build with optimizations; the app's own code stays unoptimized so
# edits still rebuild quickly.
[profile.dev.package."*"]
opt-level = 3

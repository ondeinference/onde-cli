# Publishes to pub.dev with automated publishing (OIDC), so there is no stored
# credential to expire. The package's admin page on pub.dev must enable
# publishing from GitHub Actions for this repository with the tag pattern
# v{{version}} and "push" events. pub.dev rejects workflow_dispatch runs unless
# that option is enabled there too, so a manual dispatch only verifies the
# package (analyze and dry-run) and never publishes.
#
# This runs straight from the tag push, not from release-crates.yml. The
# launcher downloads the native binary on first run, so the GitHub release
# only needs to exist by the time someone runs it.

name: CLI Release pub.dev

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to verify, without publishing (e.g. v0.5.0)"
        required: true

permissions:
  contents: read

env:
  PUB_PACKAGE_NAME: onde_cli

jobs:
  verify-package:
    name: Verify Dart package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Set the release version
        shell: bash
        run: |
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          echo "RELEASE_VERSION=${tag#v}" >> "$GITHUB_ENV"

      - name: Setup Dart SDK
        uses: dart-lang/setup-dart@v1

      - name: Pubspec version matches the tag
        shell: bash
        run: |
          pub_version="$(sed -n 's/^version: \(.*\)/\1/p' packaging/pub/onde_cli/pubspec.yaml | head -n 1)"
          if [ "${pub_version}" != "${RELEASE_VERSION}" ]; then
            echo "::error::pubspec.yaml is ${pub_version} but the tag is ${RELEASE_VERSION}"
            exit 1
          fi

      - name: Get package dependencies
        working-directory: packaging/pub/onde_cli
        run: dart pub get

      - name: Analyze Dart package
        working-directory: packaging/pub/onde_cli
        run: dart analyze

      # pub.dev treats a CHANGELOG.md that does not mention the version as a
      # validation warning, and the dry-run exits non-zero on warnings.
      - name: Dry-run publish
        working-directory: packaging/pub/onde_cli
        run: dart pub publish --dry-run

  publish-pub:
    name: Publish to pub.dev
    runs-on: ubuntu-latest
    needs: verify-package
    if: github.event_name == 'push'
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set the release version
        shell: bash
        run: echo "RELEASE_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      # setup-dart exchanges the workflow's OIDC token for a pub.dev token when
      # id-token: write is granted.
      - name: Setup Dart SDK
        uses: dart-lang/setup-dart@v1

      - name: Check whether release already exists on pub.dev
        id: pub-check
        shell: bash
        run: |
          index=$(mktemp)
          STATUS=$(curl -sS -o "${index}" -w '%{http_code}' \
            --retry 3 --retry-delay 2 --retry-all-errors \
            "https://pub.dev/api/packages/${PUB_PACKAGE_NAME}")

          case "$STATUS" in
            200)
              # Dots in the version are escaped so 0.5.0 cannot match 0x5y0, and the
              # optional spaces keep this working if the API ever pretty-prints.
              escaped_version="${RELEASE_VERSION//./\\.}"
              if grep -E "\"version\"[[:space:]]*:[[:space:]]*\"${escaped_version}\"" "${index}" >/dev/null; then
                echo "${PUB_PACKAGE_NAME} ${RELEASE_VERSION} already exists on pub.dev, skipping publish"
                echo "exists=true" >> "$GITHUB_OUTPUT"
              else
                echo "exists=false" >> "$GITHUB_OUTPUT"
              fi
              ;;
            404)
              echo "${PUB_PACKAGE_NAME} is not on pub.dev yet, publishing its first version"
              echo "exists=false" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "Unexpected ${STATUS} from pub.dev while checking ${PUB_PACKAGE_NAME} ${RELEASE_VERSION}" >&2
              exit 1
              ;;
          esac

      - name: Publish package
        if: steps.pub-check.outputs.exists != 'true'
        working-directory: packaging/pub/onde_cli
        run: dart pub publish --force

name: Tests

# One run per commit: push only for the integration branches, pull_request for
# everything else. Files that never affect a job are ignored for the whole
# workflow; the `changes` job then routes the rest per concern.

on:
  push:
    branches: [main, development]
    paths-ignore:
      - "**/*.md"
      - ".agents/**"
      - ".claude/**"
      - "docs/**"
      - "LICENSE"
      - "assets/**"
  pull_request:
    paths-ignore:
      - "**/*.md"
      - ".agents/**"
      - ".claude/**"
      - "docs/**"
      - "LICENSE"
      - "assets/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/development' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  changes:
    name: Changes
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.rust }}
      dotnet: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.dotnet }}
      dart: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.dart }}
      workflows: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.workflows }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # paths-filter only understands push and pull_request. A manual run has
      # no diff to filter, so every job runs.
      - name: Filter changed paths
        id: filter
        if: github.event_name != 'workflow_dispatch'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            rust:
              - "src/**"
              - "tests/**"
              - "benches/**"
              - "examples/**"
              - "build.rs"
              - "Cargo.*"
              - ".cargo/**"
              - "rust-toolchain.toml"
              - "rustfmt.toml"
              - "clippy.toml"
              - ".github/workflows/ci.yml"
            dotnet:
              - "packaging/nuget/**"
              - ".github/workflows/ci.yml"
            dart:
              - "packaging/pub/**"
              - ".github/workflows/ci.yml"
            workflows:
              - ".github/workflows/**"

  rust:
    name: Rust (fmt, clippy, test)
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    # build.rs exits when these are unset. Placeholders let fork PRs, which get
    # no secrets, still type-check. Scoped to the jobs that compile the crate so
    # third-party actions never see the real values.
    env:
      ONDE_APP_ID: ${{ secrets.ONDE_APP_ID || 'ci-placeholder' }}
      ONDE_APP_SECRET: ${{ secrets.ONDE_APP_SECRET || 'ci-placeholder' }}
      GRESIQ_API_KEY: ${{ secrets.GRESIQ_API_KEY || 'ci-placeholder' }}
      GRESIQ_API_SECRET: ${{ secrets.GRESIQ_API_SECRET || 'ci-placeholder' }}
      HF_TOKEN: ${{ secrets.HF_TOKEN || 'ci-placeholder' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install system dependencies
        run: sudo apt-get install -y libclang-dev

      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt -- --check

      - name: Lint
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Run tests
        run: cargo test --locked --verbose

  # Type-checks the cfg(target_os = "macos") dependencies without paying for a
  # release build on a macOS runner.
  check-macos:
    name: Check (aarch64-apple-darwin)
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: macos-26
    # build.rs exits when these are unset. Placeholders let fork PRs, which get
    # no secrets, still type-check. Scoped to the jobs that compile the crate so
    # third-party actions never see the real values.
    env:
      ONDE_APP_ID: ${{ secrets.ONDE_APP_ID || 'ci-placeholder' }}
      ONDE_APP_SECRET: ${{ secrets.ONDE_APP_SECRET || 'ci-placeholder' }}
      GRESIQ_API_KEY: ${{ secrets.GRESIQ_API_KEY || 'ci-placeholder' }}
      GRESIQ_API_SECRET: ${{ secrets.GRESIQ_API_SECRET || 'ci-placeholder' }}
      HF_TOKEN: ${{ secrets.HF_TOKEN || 'ci-placeholder' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Cargo check
        run: cargo check --locked --target aarch64-apple-darwin

  dotnet-tool:
    name: .NET tool launcher build
    needs: changes
    if: needs.changes.outputs.dotnet == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build .NET tool launcher
        run: dotnet build packaging/nuget/onde-cli/Onde.Cli.csproj --configuration Release

  dart-package:
    name: Dart pub package check
    needs: changes
    if: needs.changes.outputs.dart == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Dart SDK
        uses: dart-lang/setup-dart@v1

      - name: Get package dependencies
        working-directory: packaging/pub/onde_cli
        run: dart pub get

      - name: Analyze Dart package
        working-directory: packaging/pub/onde_cli
        run: dart analyze

  # CI cannot run a release workflow, so a lint is the check for those edits.
  actionlint:
    name: Lint workflows
    needs: changes
    if: needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download actionlint
        run: bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.12/scripts/download-actionlint.bash) 1.7.12

      - name: Run actionlint
        run: ./actionlint -color

  ci:
    name: CI status
    runs-on: ubuntu-latest
    needs:
      - changes
      - rust
      - check-macos
      - dotnet-tool
      - dart-package
      - actionlint
    if: always()
    steps:
      - name: Verify every job succeeded or was skipped
        run: |
          for result in ${{ join(needs.*.result, ' ') }}; do
            case "$result" in
              success|skipped) ;;
              *) echo "::error::a needed job finished as $result"; exit 1 ;;
            esac
          done

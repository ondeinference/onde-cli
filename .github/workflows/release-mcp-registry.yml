name: MCP Registry Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.4.1)"
        required: true

# OIDC is how we authenticate to the MCP Registry: the registry trusts a GitHub
# Actions token issued for this repository, so no long-lived secret is needed.
permissions:
  id-token: write
  contents: read

jobs:
  publish:
    name: Publish server.json to the MCP Registry
    runs-on: ubuntu-latest
    steps:
      # Unlike the other release workflows, this one builds nothing from source:
      # it uploads metadata. So it checks out the branch it was dispatched on
      # rather than the tag — `server.json` may have landed after the tag was
      # cut — and uses the tag input only to pick the version to publish.
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set the release version
        shell: bash
        run: |
          release_version="${{ github.event.inputs.tag }}"
          release_version="${release_version#v}"

          echo "RELEASE_VERSION=${release_version}" >> "$GITHUB_ENV"

      - name: Check the server name is consistent across packages
        shell: bash
        run: |
          server_name="$(jq -r '.name' packaging/mcp/server.json)"
          echo "Server name: ${server_name}"

          # npm proves ownership through `mcpName` in the published package.json,
          # rendered at release time from this template.
          grep -q "\"mcpName\": \"${server_name}\"" packaging/npm/package-main.json.tmpl

      - name: Set the version in server.json
        shell: bash
        run: |
          jq --arg v "${RELEASE_VERSION}" \
            '.version = $v | .packages |= map(.version = $v)' \
            packaging/mcp/server.json > server.tmp
          mv server.tmp packaging/mcp/server.json
          cat packaging/mcp/server.json

      - name: Verify the published package carries the ownership marker
        shell: bash
        run: |
          # The registry stores metadata only, and validates it by fetching the
          # listed package and looking for a marker naming this server. Checking
          # the sources isn't enough: a package published before the marker
          # landed will still be missing it. The comparison is case-sensitive.
          server_name="$(jq -r '.name' packaging/mcp/server.json)"

          # release-npm.yml dispatches this workflow after the base package is
          # published, so the package is normally there already. The poll covers
          # a manual dispatch made while npm is still publishing.
          for attempt in $(seq 1 20); do
            if npm view "@ondeinference/cli@${RELEASE_VERSION}" version; then
              break
            fi
            if [ "${attempt}" -eq 20 ]; then
              echo "@ondeinference/cli@${RELEASE_VERSION} is still not on npm after 10 minutes." >&2
              exit 1
            fi
            echo "Waiting for @ondeinference/cli@${RELEASE_VERSION} on npm (attempt ${attempt}/20)..."
            sleep 30
          done

          npm_mcp_name="$(npm view "@ondeinference/cli@${RELEASE_VERSION}" mcpName)"
          if [ "${npm_mcp_name}" != "${server_name}" ]; then
            echo "@ondeinference/cli@${RELEASE_VERSION} declares mcpName '${npm_mcp_name}', expected '${server_name}'." >&2
            echo "npm versions are immutable — cut a new release with the marker in place." >&2
            exit 1
          fi

      - name: Install mcp-publisher
        shell: bash
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

      - name: Authenticate to the MCP Registry
        shell: bash
        run: ./mcp-publisher login github-oidc

      - name: Publish
        shell: bash
        working-directory: packaging/mcp
        run: ../../mcp-publisher publish

      - name: Verify the server is listed
        shell: bash
        run: |
          server_name="$(jq -r '.name' packaging/mcp/server.json)"
          curl -fsSL "https://registry.modelcontextprotocol.io/v0.1/servers?search=${server_name}" | jq .

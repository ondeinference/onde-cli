name: Release Onde Desktop Direct

# Builds the universal Developer ID app for com.ondeinference.desktop, has
# Tauri notarize and staple it, verifies the DMG, and attaches it to a draft
# GitHub release `desktop-v<version>`. A person reviews and publishes the draft.
# It runs packaging/app/scripts/build-direct.sh, the same script as a local
# `pnpm direct`.
#
# Trigger: push to release/desktop-direct, or workflow_dispatch. It never runs
# on pull requests, so forks cannot reach the secrets.
#
# Secrets:
#   DEVELOPER_ID_CERTIFICATE (+_PASSWORD)   base64 .p12, "Developer ID Application"
#   DEVELOPER_ID_PROVISIONING_PROFILE       base64 .provisionprofile
#   APPLE_API_KEY, APPLE_API_KEY_STRING, APPLE_API_ISSUER   App Store Connect key id, .p8 text, issuer
#   ONDE_APP_ID, ONDE_APP_SECRET, GRESIQ_API_KEY, GRESIQ_API_SECRET, HF_TOKEN   baked into the build

on:
  push:
    branches:
      - release/desktop-direct
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-desktop-direct
  cancel-in-progress: false

jobs:
  build:
    name: Build, notarize and draft the release
    runs-on: macos-26
    timeout-minutes: 120
    permissions:
      contents: write
    env:
      # A release must never ship without the credentials, so a missing one fails the build.
      ONDE_REQUIRE_CREDENTIALS: "1"
      ONDE_APP_ID: ${{ secrets.ONDE_APP_ID }}
      ONDE_APP_SECRET: ${{ secrets.ONDE_APP_SECRET }}
      GRESIQ_API_KEY: ${{ secrets.GRESIQ_API_KEY }}
      GRESIQ_API_SECRET: ${{ secrets.GRESIQ_API_SECRET }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Read the Rust toolchain
        run: echo "RUST_TOOLCHAIN=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml | head -n 1)" >> "$GITHUB_ENV"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: packaging/app/src-tauri
          key: desktop-direct

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: Install frontend dependencies
        working-directory: packaging/app
        run: pnpm install --frozen-lockfile

      - name: Create the signing keychain
        env:
          DEVELOPER_ID_CERTIFICATE: ${{ secrets.DEVELOPER_ID_CERTIFICATE }}
          DEVELOPER_ID_CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_CERTIFICATE_PASSWORD }}
        run: |
          packaging/app/scripts/ci-keychain.sh create \
            DEVELOPER_ID_CERTIFICATE DEVELOPER_ID_CERTIFICATE_PASSWORD

      - name: Decode the provisioning profile
        env:
          DEVELOPER_ID_PROVISIONING_PROFILE: ${{ secrets.DEVELOPER_ID_PROVISIONING_PROFILE }}
        run: |
          profile="$RUNNER_TEMP/embedded.provisionprofile"
          printf '%s' "$DEVELOPER_ID_PROVISIONING_PROFILE" | base64 --decode > "$profile"
          [ -s "$profile" ] || { echo "::error::DEVELOPER_ID_PROVISIONING_PROFILE is empty."; exit 1; }
          echo "DEVID_PROVISIONING_PROFILE_PATH=$profile" >> "$GITHUB_ENV"

      - name: Write the App Store Connect key
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_STRING: ${{ secrets.APPLE_API_KEY_STRING }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          keys="$RUNNER_TEMP/private_keys"
          mkdir -p "$keys"
          printf '%s\n' "$APPLE_API_KEY_STRING" > "$keys/AuthKey_${APPLE_API_KEY}.p8"
          {
            echo "API_PRIVATE_KEYS_DIR=$keys"
            echo "ASC_API_KEY=$APPLE_API_KEY"
            echo "ASC_ISSUER_ID=$APPLE_API_ISSUER"
          } >> "$GITHUB_ENV"

      - name: Build, notarize and verify
        run: packaging/app/scripts/build-direct.sh all

      - name: Find the DMG
        id: dmg
        run: |
          dmg="$(find packaging/app/src-tauri/target/universal-apple-darwin/release/bundle/dmg -name '*.dmg' -print -quit)"
          [ -n "$dmg" ] || { echo "::error::No DMG was produced."; exit 1; }
          echo "path=$dmg" >> "$GITHUB_OUTPUT"
          echo "version=$(node -p "require('./packaging/app/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Upload the DMG as an artifact
        uses: actions/upload-artifact@v4
        with:
          name: onde-desktop-dmg
          path: ${{ steps.dmg.outputs.path }}
          if-no-files-found: error
          retention-days: 14

      - name: Attach the DMG to a draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.dmg.outputs.version }}
          DMG: ${{ steps.dmg.outputs.path }}
        run: |
          tag="desktop-v${VERSION}"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --draft --target "$GITHUB_SHA" \
              --title "Onde Desktop v${VERSION}" \
              --notes "Signed and notarized macOS build. Open the DMG and drag Onde Desktop to Applications."
          fi
          gh release upload "$tag" "$DMG" --clobber

      - name: Remove the signing keychain and secrets
        if: always()
        run: |
          packaging/app/scripts/ci-keychain.sh remove
          rm -rf "$RUNNER_TEMP/private_keys" "$RUNNER_TEMP/embedded.provisionprofile"
